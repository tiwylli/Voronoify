name: Test and deploy Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Hugging Face requires this metadata at the top; GitHub otherwise renders it first.
      - name: Build Hugging Face README
        run: |
          {
            printf '%s\n' '---'
            cat .huggingface/space-metadata.yml
            printf '%s\n\n' '---'
            cat README.md
          } > README.space.md
          mv README.space.md README.md
      - name: Install Hugging Face CLI
        run: python -m pip install --upgrade huggingface_hub
      - name: Deploy Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: >-
          hf upload tiwylli/voronoify . .
          --repo-type space
          --exclude '.git/*'
          --exclude '.github/*'
          --exclude '.huggingface/*'
          --delete '*'
          --commit-message "Deploy from GitHub ${{ github.sha }}"
